name: ci

# What runs here: the static checker and a production build.
#
# What also runs here, as of round eight: the in-page suite at ?selftest=1, in
# the `in-page` job below. It asserts against a live DOM — that the timeline
# painted one tick per step, that the messages panel stays virtualised, that
# failure is stated in words as well as colour — so it needs a browser driving a
# running server, which ubuntu-latest already has.
#
# This comment used to say that suite was run by hand before every merge. That
# was true as an intention and false as a fact: eighteen of its assertions were
# failing on main for the whole of round five, through six green runs of this
# workflow, because four concurrent copies of the suite were fighting over one
# page. Nobody noticed until somebody opened a browser for an unrelated reason.
# That is the reason the job below exists and the reason it asserts the exact
# totals rather than only that nothing failed.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # verify.mjs imports the parser and the redactor as TypeScript
          # modules directly, which relies on the type stripping that became
          # unflagged in Node 22.18.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node verify.mjs

      # Two counters guard the assertions in this repository — one accumulated
      # while a run happens, one taken statically over the source — and neither
      # is sufficient alone. A check written and never called is invisible to
      # the first; a check that runs twice round a loop is invisible to the
      # second. This step breaks both on purpose, four ways, and requires each
      # break to be caught by the counter that is supposed to catch it. It also
      # requires an unmutated copy to come back clean, which is what stops the
      # guard from reporting five successes while the checker is broken in some
      # other way. No browser, so unlike the in-page suite it belongs here.
      - run: npm run counters

      - run: npx next build

  # The in-page suite, in no-helper mode, against a production build.
  #
  # No-helper is not inferred, it is asserted. The suite has two modes with two
  # frozen shapes precisely so this is unambiguous, and a run that silently took
  # the other branch and passed a different total is the exact failure the
  # two-mode design exists to prevent — so the driver fails if the page reports
  # a mode other than the one it asked for, and this job checks the contract
  # line as well.
  in-page:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next build

      # Backgrounded and waited for, rather than slept at. The driver refuses to
      # run against a server that is not serving this build — it compares
      # .next/BUILD_ID with what the page carries — so a leftover process on the
      # port is a red build rather than a green one against code nobody
      # compiled.
      - name: serve the production build
        run: |
          npx next start -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/; then
              echo "serving after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::nothing came up on 127.0.0.1:3000"
          tail -20 /tmp/next.log
          exit 1

      # The contract is three numbers, not one. Any of them moving is red:
      # 168 declared, 4 skipped, 0 failed — and therefore 164 passed.
      - name: the in-page suite, no-helper mode
        env:
          SELFTEST_TIMEOUT: "180000"
        run: |
          set -o pipefail
          node scripts/selftest.mjs http://127.0.0.1:3000/ | tee /tmp/selftest.txt
          grep -qF "[no-helper]" /tmp/selftest.txt \
            || { echo "::error::the suite did not report no-helper mode"; exit 1; }
          grep -qF "164/168 passed · 0 failed · 4 not run here · 168 declared, 4 skips declared" /tmp/selftest.txt \
            || { echo "::error::the declared totals moved"; exit 1; }
          echo "wall time: $(grep -o '[0-9.]*s$' /tmp/selftest.txt | tail -1)"

      # Dogfooding. The exit code of `agenttape check` is the whole feature —
      # it is what lets somebody put this in their own CI — so it is exercised
      # here in both directions rather than described in a README.
      - name: a run that meets its expectations exits 0
        run: node bin/agenttape.mjs check fixtures/expectations.rules.json fixtures/passing.tape.json
      - name: a run that does not exits non-zero
        run: |
          if node bin/agenttape.mjs check fixtures/expectations.rules.json fixtures/failing.tape.json; then
            echo "::error::the checker passed a tape that breaks every rule"
            exit 1
          fi
          echo "the checker failed it, as it should have"
